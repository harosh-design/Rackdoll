<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Layered resort scenery validation</title>
<style>
body { margin: 24px; background: #0b1423; color: #d9e5ee; font: 15px system-ui; }
canvas { display: block; width: min(100%, 960px); margin: 16px 0; }
button { padding: 10px 18px; margin-right: 8px; }
pre { white-space: pre-wrap; }
</style>
<h1>Layered resort scenery</h1>
<button id="toggle">Pause scenery</button>
<button id="reduce">Enable reduced motion</button>
<canvas id="preview" width="1280" height="800"></canvas>
<pre id="report">Validating...</pre>
<script type="module">
import { ResortBackground, resortBackgroundLayout } from '/src/render/resortBackground.ts';
import { ResortForeground } from '/src/render/resortForeground.ts';

const load = file => new Promise((resolve, reject) => {
  const image = new Image(); image.onload = () => resolve(image); image.onerror = reject;
  image.src = '/art/resort/' + file;
});
const [plate, palms, plants] = await Promise.all(['background-layered.webp', 'palms-layered.webp', 'foreground-plants.webp'].map(load));
const nativeMedia = window.matchMedia.bind(window);
const preference = { matches: false };
window.matchMedia = query => query === '(prefers-reduced-motion: reduce)' ? preference : nativeMedia(query);
const background = new ResortBackground(plate, palms), foreground = new ResortForeground(plants);
window.matchMedia = nativeMedia;
const canvas = document.querySelector('#preview'), ctx = canvas.getContext('2d');
const sample = document.createElement('canvas'); sample.width = 640; sample.height = 400;
const sampling = sample.getContext('2d', { willReadFrequently: true });
const fit = resortBackgroundLayout(640, 400, plate.naturalWidth, plate.naturalHeight);
const frame = (time, focus = 0) => {
  background.draw(sampling, 640, 400, time, { x: focus, y: 0 });
  return sampling.getImageData(0, 0, 640, 400).data;
};
const difference = (a, b, uv) => {
  const bounds = [fit.x + fit.width * uv[0], fit.imageY + fit.imageHeight * uv[1], fit.x + fit.width * uv[2], fit.imageY + fit.imageHeight * uv[3]].map(Math.round);
  let changed = 0, magnitude = 0, count = 0;
  for (let y = bounds[1]; y < bounds[3]; y++) for (let x = bounds[0]; x < bounds[2]; x++) {
    const at = (y * 640 + x) * 4;
    const d = Math.abs(a[at] - b[at]) + Math.abs(a[at + 1] - b[at + 1]) + Math.abs(a[at + 2] - b[at + 2]);
    if (d > 3) changed++;
    magnitude += d; count++;
  }
  return { changed, meanDifference: magnitude / count };
};
const a = frame(0), b = frame(6);
const regions = {
  palmFronds: [0.04, 0.04, 0.26, 0.25],
  water: [0.25, 0.51, 0.75, 0.70],
  clouds: [0.35, 0.18, 0.60, 0.35],
  hotel: [0.855, 0.30, 0.89, 0.35],
  cliff: [0.81, 0.41, 0.87, 0.448],
  sand: [0.25, 0.80, 0.75, 0.97],
};
const motion = Object.fromEntries(Object.entries(regions).map(([key, uv]) => [key, difference(a, b, uv)]));
const p0 = frame(3, -1), p1 = frame(3, 1);
const parallax = { foliage: difference(p0, p1, regions.palmFronds), hotel: difference(p0, p1, regions.hotel), sand: difference(p0, p1, regions.sand) };
const same = frame(6);
const deterministic = b.every((v, i) => v === same[i]);
preference.matches = true;
const r0 = frame(0, -1), r1 = frame(10, 1);
const reducedMotionStable = r0.every((v, i) => v === r1[i]);
preference.matches = false;
let foregroundCenterCoverage = 0;
sampling.clearRect(0, 0, 640, 400);
foreground.draw(sampling, 640, 400, 7, { x: 1, y: 1 });
const front = sampling.getImageData(0, 0, 640, 400).data;
for (let y = 0; y < 400; y++) for (let x = 62; x < 578; x++) if (front[(y * 640 + x) * 4 + 3]) foregroundCenterCoverage++;
const gpuReady = Boolean(background.program);
const assertions = {
  gpuReady,
  movingFoliage: motion.palmFronds.changed > 100,
  movingSea: motion.water.changed > 100,
  movingClouds: motion.clouds.changed > 100,
  stableHotel: motion.hotel.changed === 0,
  stableCliff: motion.cliff.changed === 0,
  stableSand: motion.sand.changed === 0,
  separateParallax: parallax.foliage.changed > 100 && parallax.hotel.changed === 0 && parallax.sand.changed === 0,
  deterministic, reducedMotionStable,
  unobstructedCourt: foregroundCenterCoverage === 0,
};

// Simulate context loss to verify that both plates survive in the Canvas fallback.
let fallbackVisible = false;
document.querySelector('#report').textContent = JSON.stringify({ stage: 'context loss', assertions, motion, parallax }, null, 2);
if (background.gl) {
  const loss = background.gl.getExtension('WEBGL_lose_context');
  if (loss) {
    const lost = new Promise(resolve => {
      background.surface.addEventListener('webglcontextlost', resolve, { once: true });
      setTimeout(resolve, 1500);
    });
    loss.loseContext(); await lost;
    const fallback = frame(0);
    fallbackVisible = fallback[200 * 640 * 4 + 320 * 4 + 2] > 10
      && difference(fallback, a, regions.palmFronds).meanDifference < 25;
    await new Promise(resolve => setTimeout(resolve, 1100));
    const restored = new Promise(resolve => {
      background.surface.addEventListener('webglcontextrestored', resolve, { once: true });
      setTimeout(resolve, 2500);
    });
    loss.restoreContext(); await restored;
    assertions.contextRestored = Boolean(background.program);
  }
}
assertions.fallbackVisible = fallbackVisible;
const report = { passed: Object.values(assertions).every(Boolean), assertions, motion, parallax, foregroundCenterCoverage };
document.querySelector('#report').textContent = JSON.stringify(report, null, 2);
window.layeredSceneryReport = report;

let paused = false, seconds = 0, last = performance.now();
document.querySelector('#toggle').onclick = event => { paused = !paused; event.target.textContent = paused ? 'Resume scenery' : 'Pause scenery'; };
document.querySelector('#reduce').onclick = event => { preference.matches = !preference.matches; event.target.textContent = preference.matches ? 'Disable reduced motion' : 'Enable reduced motion'; };
function draw(now) {
  if (!paused) seconds += Math.min(0.1, (now - last) / 1000);
  last = now;
  background.draw(ctx, 1280, 800, seconds, { x: 0, y: 0 });
  foreground.draw(ctx, 1280, 800, seconds, { x: 0, y: 0 });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</html>
