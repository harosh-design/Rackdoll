<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Shader arena visual verification</title>
<style>
  body { isolation: isolate; margin: 0; background: #08111d; color: #dce8ec; font: 13px system-ui; }
  #ambient-backdrop { position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none; }
  main { width: min(1100px, 96vw); margin: 20px auto; }
  canvas { display: block; width: 100%; aspect-ratio: 16/10; border-radius: 10px; }
  nav { display: flex; gap: 12px; margin: 12px 0; }
  button { color: inherit; background: #182d40; border: 1px solid #466277; border-radius: 5px; padding: 8px 12px; }
  pre { white-space: pre-wrap; }
</style>
<canvas id="ambient-backdrop" aria-hidden="true"></canvas>
<main>
  <canvas id="game" aria-label="Shader arena verification scene"></canvas>
  <nav><button id="match">Match scene</button><button id="equipment">All five hazards</button><button id="audit">Run visual checks</button></nav>
  <pre id="result">Loading shader arena...</pre>
</main>
<script type="module">
import { ShaderScene } from '/src/render/shaderScene.ts';
import { closedPoses } from '/src/render/dollPose.ts';
import { Renderer } from '/src/render/renderer.ts';
import { Interpolator } from '/src/render/interp.ts';
import { GameWorld } from '/src/sim/world.ts';
import { Executer } from '/src/sim/executer.ts';
import { executerVariant } from '/src/sim/executerVariants.ts';
import { toM } from '/src/sim/constants.ts';
import { drawArenaSprite } from '/src/render/arenaArt.ts';

const canvas = document.querySelector('#game');
const backdrop = document.querySelector('#ambient-backdrop');
const renderer = new Renderer(canvas, backdrop);
renderer.setVisualStyle('shaders');
new ResizeObserver(() => renderer.resize()).observe(backdrop);
await renderer.ready;
let world, frames;
const hud = { singlePlayer: true, paused: true, message: null, messageTone: 0 };
function scene(all = false) {
  world = new GameWorld({ singlePlayer: true, bees: false, hazards: true });
  world.game.score[1] = 4; world.game.score[2] = 3; world.frame = 90;
  world.ball.body.setTransform({ x: toM(360), y: toM(30) }, 0);
  world.ball.ballOfPlayer = 0;
  const ids = all ? ['magnet', 'boxer', 'comet', 'spring', 'slime'] : ['spring', 'comet'];
  const positions = all ? [-125, 20, 200, 590, 770] : [-90, 710];
  ids.forEach((id, i) => {
    const side = positions[i] < 320 ? 1 : 2;
    const e = new Executer({ world: world.world, timers: world.timers,
      target: side === 1 ? world.p1 : world.p2, side, variant: executerVariant(id),
      origin: { x: toM(positions[i]), y: toM(325) }, lifeSeconds: 20 });
    e.age = 30; world.executers.push(e);
  });
  for (const [x, kind, dir] of [[50, 'highJump', 1], [600, 'speed', -1]]) {
    world.bees.bees.push({ kind, dir, startXPx: x, baseYPx: 5, phase: 0, age: 0, prevAge: 0 });
  }
  world.powerUps.activate(2, 'speed', world.frame);
  frames = new Interpolator();
  renderer.draw(world, frames, 1, hud);
}
scene();
document.querySelector('#result').textContent = 'Ready. Production renderer with live glass and chrome shaders.';
document.querySelector('#match').onclick = () => scene();
document.querySelector('#equipment').onclick = () => scene(true);
document.querySelector('#audit').onclick = async () => {
  const checks = {}, measurements = {}, errors = [];
  const ctx = canvas.getContext('2d');
  const pixels = () => ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const delta = (a,b) => { let changed=0, total=0, max=0;
    for(let i=0;i<a.length;i+=4) { const d=Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]));
      if(d) changed++; total+=d; max=Math.max(max,d); }
    return {changed, mean:total/(a.length/4), max}; };
  const next = () => new Promise(resolve => requestAnimationFrame(resolve));
  try {
    scene(true);
    checks.compiledWebGL = !!renderer.shaders.program;
    renderer.scenerySeconds = 8; renderer.draw(world,frames,1,hud);
    const before = pixels(); await next(); renderer.draw(world,frames,1,hud);
    checks.pauseStable = delta(before,pixels()).changed === 0;
    const backdropCtx=backdrop.getContext('2d');
    const backdropPixels=()=>backdropCtx.getImageData(0,0,backdrop.width,backdrop.height).data;
    const backdropBefore=backdropPixels();
    await next(); renderer.draw(world,frames,1,hud);
    checks.backdropPauseStable=delta(backdropBefore,backdropPixels()).changed===0;
    const backdropRect=backdrop.getBoundingClientRect(), stageRect=canvas.getBoundingClientRect();
    checks.backdropCoversViewport=backdropRect.width===innerWidth&&backdropRect.height===innerHeight;
    const leftEdge=Math.floor((stageRect.left-backdropRect.left)/backdropRect.width*backdrop.width);
    const rightEdge=Math.ceil((stageRect.right-backdropRect.left)/backdropRect.width*backdrop.width);
    let sideMin=255,sideMax=0,sidePixels=0;
    for(let y=0;y<backdrop.height;y+=4)for(let x=0;x<backdrop.width;x+=4){
      if(x>=leftEdge&&x<=rightEdge)continue;
      const offset=(y*backdrop.width+x)*4;
      const value=Math.max(backdropBefore[offset],backdropBefore[offset+1],backdropBefore[offset+2]);
      sideMin=Math.min(sideMin,value);sideMax=Math.max(sideMax,value);sidePixels++;
    }
    measurements.sideFields={sideMin,sideMax,sidePixels};
    checks.sideFieldsProcedural=sidePixels>0&&sideMax-sideMin>20;
    renderer.scenerySeconds=8.05;renderer.draw(world,frames,1,hud);
    checks.backdropFlows=delta(backdropBefore,backdropPixels()).changed>100;
    renderer.scenerySeconds = 8.05; renderer.draw(world,frames,1,hud);
    measurements.nearbyFrames = delta(before,pixels());
    checks.smoothFlow = measurements.nearbyFrames.changed > 100 && measurements.nearbyFrames.mean < 3;
    renderer.scenerySeconds = 20; renderer.draw(world,frames,1,hud);
    checks.flowChangesOverTime = delta(before,pixels()).mean > 1;
    const motion = renderer.shaders.reducedMotion;
    renderer.shaders.reducedMotion = {matches:true};
    renderer.draw(world,frames,1,hud); const still=pixels();
    renderer.scenerySeconds = 30; renderer.draw(world,frames,1,hud);
    checks.reducedMotionStable = delta(still,pixels()).changed === 0;
    renderer.shaders.reducedMotion = motion;
    const beforeBodies = world.p1.bodies.map(b => ({x:b.getPosition().x,y:b.getPosition().y,a:b.getAngle()}));
    renderer.draw(world,frames,1,hud);
    checks.renderDoesNotMovePhysics = world.p1.bodies.every((b,i) => b.getPosition().x===beforeBodies[i].x && b.getPosition().y===beforeBodies[i].y && b.getAngle()===beforeBodies[i].a);
    // Read the material pass itself: each player's silhouette must be connected.
    const gpu=renderer.shaders.gl, sw=renderer.shaders.surface.width, sh=renderer.shaders.surface.height;
    const alphaPixels=new Uint8Array(sw*sh*4); gpu.readPixels(0,0,sw,sh,gpu.RGBA,gpu.UNSIGNED_BYTE,alphaPixels);
    const mw=Math.floor(sw/2), mh=Math.floor(sh/2), seen=new Uint8Array(mw*mh);
    const visible=i=>alphaPixels[((Math.floor(i/mw)*2)*sw+(i%mw)*2)*4+3]>128;
    const sizes=[];
    for(let i=0;i<seen.length;i++) {
      if(seen[i]||!visible(i)) continue;
      const queue=[i];seen[i]=1;
      for(let n=0;n<queue.length;n++) {
        const at=queue[n], x=at%mw, y=Math.floor(at/mw);
        for(const q of [x>0?at-1:-1,x+1<mw?at+1:-1,y>0?at-mw:-1,y+1<mh?at+mw:-1]) {
          if(q>=0&&!seen[q]&&visible(q)){seen[q]=1;queue.push(q);}
        }
      }
      if(queue.length>20) sizes.push(queue.length);
    }
    measurements.silhouetteComponents=sizes;
    checks.twoConnectedPlayerSilhouettes=sizes.length===2;
    checks.noGpuErrors = renderer.shaders.gl.getError() === 0;
    const ext=renderer.shaders.gl.getExtension('WEBGL_lose_context');
    if(ext) {
      ext.loseContext(); await next(); await next();
      renderer.draw(world,frames,1,hud);
      checks.contextLossFallback = renderer.shaders.program === null && pixels().some((v,i) => i%4!==3 && v>40);
      ext.restoreContext();
      for(let n=0;n<120&&!renderer.shaders.program;n++) await next();
      checks.contextRestored = !!renderer.shaders.program;
      renderer.draw(world,frames,1,hud);
      checks.restoredGpuNoErrors = renderer.shaders.gl.getError()===0;
    }
    const getContext = HTMLCanvasElement.prototype.getContext;
    let fallback;
    try {
      HTMLCanvasElement.prototype.getContext=function(type,...args) { return type==='webgl' ? null : getContext.call(this,type,...args); };
      fallback = new ShaderScene();
    } finally { HTMLCanvasElement.prototype.getContext=getContext; }
    fallback.drawBackground(ctx,0,0.84);
    const base=pixels();
    renderer.worldSpace(ctx); fallback.drawPlayers(ctx,[world.p1,world.p2],closedPoses(frames,1,[world.p1,world.p2],world.ball.body),1,0);
    checks.noWebGLPlayersFallback = delta(base,pixels()).changed>100;
    const small=document.createElement('canvas'); small.style.cssText='width:360px;height:225px';
    document.body.append(small); const narrow=new Renderer(small); await narrow.ready;
    narrow.draw(world,frames,1,hud); checks.narrowViewport=small.width>=360;
    const smallData=small.getContext('2d').getImageData(0,0,small.width,small.height).data;
    checks.narrowFrameRendered=smallData.some((v,i)=>i%4!==3&&v>90); small.remove();
    world.powerUps.activate(1,'giant',world.frame);
    for(let n=0;n<16;n++) world.step();
    renderer.draw(world,new Interpolator(),1,hud);
    checks.giantRenders=world.p1.sizeScale>1.4;
    scene(); renderer.scenerySeconds=8;
    const started=performance.now();
    for(let n=0;n<20;n++) renderer.draw(world,frames,1,hud);
    // Pixel readback synchronizes queued GPU work before reporting timing.
    renderer.shaders.gl.readPixels(0,0,1,1,renderer.shaders.gl.RGBA,renderer.shaders.gl.UNSIGNED_BYTE,new Uint8Array(4));
    measurements.averageRenderMs=(performance.now()-started)/20;
  } catch(error) { errors.push(error.stack); }
  document.querySelector('#result').textContent=JSON.stringify({passed:errors.length===0&&Object.values(checks).every(Boolean),checks,measurements,errors},null,2);
};
</script>
</html>
