<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Injured player visual verification</title>
<style>
body { margin: 0; padding: 12px; background: #101722; color: #dceaf1; font: 14px system-ui; }
h1 { font-size: 18px; } canvas { display: block; width: 640px; height: 400px; max-width: 100%; }
p { margin: 12px 0 4px; }
canvas { height: auto; aspect-ratio: 8 / 5; }
</style>
<h1>Injured players: continued play in both graphics styles</h1>
<p>People: player 1 lost the right arm; player 2 lost the left leg.</p>
<canvas id="people" aria-label="People injury preview"></canvas>
<p>Shaders: the same injuries, detached pieces and net blade.</p>
<canvas id="shaders" aria-label="Shader injury preview"></canvas>
<p id="result">Loading art...</p>
<script type="module">
import { Vec2 } from 'planck';
import { GameWorld } from '/src/sim/world.ts';
import { Interpolator } from '/src/render/interp.ts';
import { Renderer } from '/src/render/renderer.ts';
const gw = new GameWorld({ singlePlayer: false, hazards: false, bees: false });
for (let i = 0; i < 60; i++) gw.step();
gw.p1.sever('ArmRight');
gw.p2.sever('LegLeft');
gw.p1.part('ArmRight').setTransform(Vec2(7, 10.7), 0.4);
gw.p1.part('HandRight').setTransform(Vec2(7.7, 11), 0.6);
gw.p1.part('FingerRight').setTransform(Vec2(8.2, 11.2), 0.6);
gw.p2.part('LegLeft').setTransform(Vec2(14, 10.8), 1.5);
gw.p2.part('FootLeft').setTransform(Vec2(14.7, 10.8), 1.5);
gw.game.newRound();
const interp = new Interpolator();
const bodies = [];
for (let body = gw.world.getBodyList(); body; body = body.getNext()) bodies.push(body);
interp.commit(bodies);
for (const style of ['people', 'shaders']) {
  const renderer = new Renderer(document.getElementById(style));
  renderer.setVisualStyle(style);
  await renderer.ready;
  renderer.draw(gw, interp, 1, { singlePlayer: false, paused: true, message: null, messageTone: 0 });
}
document.getElementById('result').textContent = 'Both players remain injured after the round reset. The ball is held by a surviving hand.';
</script>
</html>
