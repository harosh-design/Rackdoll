<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Future arena visual verification</title>
<style>
  body { margin: 0; background: #08111d; color: #dce8ec; font: 13px system-ui; }
  main { width: min(1100px, 96vw); margin: 20px auto; }
  canvas { display: block; width: 100%; aspect-ratio: 16/10; border-radius: 10px; }
  nav { display: flex; gap: 12px; margin: 12px 0; }
  button { color: inherit; background: #182d40; border: 1px solid #466277; border-radius: 5px; padding: 8px 12px; }
  pre { white-space: pre-wrap; }
</style>
<main>
  <canvas id="game" aria-label="Future arena verification scene"></canvas>
  <nav><button id="match">Match scene</button><button id="equipment">All five hazards</button><button id="audit">Run visual checks</button></nav>
  <pre id="result">Loading arena assets...</pre>
</main>
<script type="module">
import { Renderer } from '/src/render/renderer.ts';
import { Interpolator } from '/src/render/interp.ts';
import { GameWorld } from '/src/sim/world.ts';
import { Executer } from '/src/sim/executer.ts';
import { executerVariant } from '/src/sim/executerVariants.ts';
import { toM } from '/src/sim/constants.ts';
import { drawArenaSprite } from '/src/render/arenaArt.ts';

const canvas = document.querySelector('#game');
const renderer = new Renderer(canvas);
await renderer.ready;
let world, frames;
const hud = { singlePlayer: true, paused: true, message: null, messageTone: 0 };
function scene(all = false) {
  world = new GameWorld({ singlePlayer: true, bees: false, hazards: true });
  world.game.score[1] = 4; world.game.score[2] = 3; world.frame = 90;
  world.ball.body.setTransform({ x: toM(360), y: toM(30) }, 0);
  world.ball.ballOfPlayer = 0;
  const ids = all ? ['magnet', 'boxer', 'comet', 'spring', 'slime'] : ['spring', 'comet'];
  const positions = all ? [-125, 20, 200, 590, 770] : [-90, 710];
  ids.forEach((id, i) => {
    const side = positions[i] < 320 ? 1 : 2;
    const e = new Executer({ world: world.world, timers: world.timers,
      target: side === 1 ? world.p1 : world.p2, side, variant: executerVariant(id),
      origin: { x: toM(positions[i]), y: toM(325) }, lifeSeconds: 20 });
    e.age = 30; world.executers.push(e);
  });
  for (const [x, kind, dir] of [[50, 'highJump', 1], [600, 'speed', -1]]) {
    world.bees.bees.push({ kind, dir, startXPx: x, baseYPx: 5, phase: 0, age: 0, prevAge: 0 });
  }
  world.powerUps.activate(2, 'speed', world.frame);
  frames = new Interpolator();
  renderer.draw(world, frames, 1, hud);
}
scene();
document.querySelector('#result').textContent = 'Ready. Scene uses the production Renderer and sprite assets.';
document.querySelector('#match').onclick = () => scene();
document.querySelector('#equipment').onclick = () => scene(true);
document.querySelector('#audit').onclick = async () => {
  const checks = {}, messages = [];
  try {
    const assets = ['background', 'courier', 'parcel', 'magnet', 'boxer', 'porter', 'spring-base', 'spring-cap', 'spa'];
    for (const name of assets) {
      const image = new Image(); image.src = '/art/arena/' + name + '.webp'; await image.decode();
      if (name === 'background') { checks.backgroundLoaded = image.naturalWidth > 1000; continue; }
      const test = document.createElement('canvas'); test.width = image.naturalWidth; test.height = image.naturalHeight;
      const ctx = test.getContext('2d'); ctx.drawImage(image, 0, 0);
      const pixels = ctx.getImageData(0, 0, test.width, test.height).data;
      let clear = 0, solid = 0;
      for (let i = 3; i < pixels.length; i += 4) { if (pixels[i] === 0) clear++; if (pixels[i] > 240) solid++; }
      checks[name + 'Transparent'] = clear > 100 && solid > 100;
      ctx.clearRect(0, 0, test.width, test.height);
      checks[name + 'Drawable'] = drawArenaSprite(ctx, name, test.width / 2, test.height / 2, test.width, test.height);
    }
    scene(true); checks.allFiveRendered = world.executers.length === 5;
    const ctx = canvas.getContext('2d'); const before = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.draw(world, frames, 1, hud);
    const after = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let changed = 0, maxDelta = 0, x0 = canvas.width, y0 = canvas.height, x1 = 0, y1 = 0;
    for (let i = 0; i < before.length; i += 4) {
      if (before[i] === after[i] && before[i+1] === after[i+1] && before[i+2] === after[i+2]) continue;
      changed++; maxDelta = Math.max(maxDelta, Math.abs(before[i]-after[i]), Math.abs(before[i+1]-after[i+1]), Math.abs(before[i+2]-after[i+2]));
      const x = (i / 4) % canvas.width, y = Math.floor(i / 4 / canvas.width);
      x0 = Math.min(x0,x); y0 = Math.min(y0,y); x1 = Math.max(x1,x); y1 = Math.max(y1,y);
    }
    checks.pausedFrameStable = changed === 0;
    if (changed) messages.push(JSON.stringify({changed, maxDelta, bounds:[x0,y0,x1,y1]}));
    world.frame += 2;
    renderer.draw(world, frames, 1, hud);
    const animated = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const unit = canvas.width / 640;
    let rotorPixels = 0;
    for (let y = Math.floor(90 * unit); y < Math.floor(170 * unit); y++) {
      for (let x = Math.floor(120 * unit); x < Math.floor(220 * unit); x++) {
        const i = (y * canvas.width + x) * 4;
        if (animated[i] !== after[i] || animated[i+1] !== after[i+1] || animated[i+2] !== after[i+2]) rotorPixels++;
      }
    }
    checks.rotorsReactToSimulationFrames = rotorPixels > 10;
    const small = document.createElement('canvas'); small.style.cssText = 'width:360px;height:225px';
    document.body.append(small); const narrow = new Renderer(small); await narrow.ready;
    narrow.draw(world, frames, 1, hud); checks.narrowViewport = small.width > 0; small.remove();
  } catch (error) { messages.push(error.stack); }
  const report = { passed: messages.length === 0 && Object.values(checks).every(Boolean), checks, messages };
  document.querySelector('#result').textContent = JSON.stringify(report, null, 2);
};
</script>
</html>
